# 流行り調査の条件（毎週のルーティンがこのファイルを読んで調べます）
# 変更したら main にマージしてください。翌週の調査から反映されます。

target:
  age: "18-22"            # 年代
  gender: "女性"
  lifestyle: ["大学生", "専門学生", "フリーター"]
  region: "日本"

product:
  name: "【アプリ名】"     # 紹介する配信アプリ（決まったら書き換える）
  type: "配信アプリ（視聴者向け）"

# 調べる期間（直近◯日以内に話題になったもの）
period_days: 14

# 話題の大きさの目安。記事やランキングに載っている公表値でしか判断できません
# （Instagram/TikTok の数値を直接取得することは、規約上できません）
min_reported_views: 100000   # 「◯万回再生」などの記載がある場合の下限

# 優先して探すテーマ（空でもOK）
focus_keywords: ["推し活", "寝る前", "ひとり時間", "大学生あるある", "診断",
                  "居場所", "コメント交流", "平成女児", "界隈", "夜ふかし"]

# 話題の情報源（上から順に試し、アクセスできないものは飛ばす）
sources:
  web_search: true              # 「Xで話題」「トレンド入り」の記事を検索（常に使える）
  google_trends_rss: true       # 環境の Allowed domains に trends.google.co.jp が必要
  yahoo_realtime: false         # 利用規約の確認が済むまで使わない
  x_official_api: false         # 有料プランが必要。成果が出てから検討

# 使わないテーマ・言葉
exclude_keywords: ["出会い", "稼げる", "副業", "恋愛マッチング", "JK", "制服",
                   "事件", "事故", "災害", "訃報", "炎上", "政治"]

# 1週間に作る台本の数
weekly_output:
  reels: 3
  promo_ratio: "3本中1本だけ宣伝（残りは日常・あるある・診断）"

# 自分のアカウントの実績を使う（insights/ に CSV を置くと、伸びた型を優先する）
use_own_insights: true
